<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub File Uploader (Supports Images & JSON)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="file"] {
            background-color: #fafafa;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #24292e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #444;
        }
        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub File Uploader</h2>
    
    <div class="form-group">
        <label>GitHub Token (ghp_...)</label>
        <input type="password" id="token" placeholder="วาง GitHub Token ของคุณที่นี่">
    </div>

    <div class="form-group">
        <label>Repository (ชื่อผู้ใช้/ชื่อคลัง)</label>
        <input type="text" id="repo" placeholder="ตัวอย่าง: hunmai/ovpn-th">
    </div>

    <div class="form-group">
        <label>Path และชื่อไฟล์ปลายทางบน GitHub</label>
        <input type="text" id="path" placeholder="ตัวอย่าง: khamvpn/up-file.json">
    </div>

    <div class="form-group" style="border: 2px dashed #bbb; padding: 15px; border-radius: 6px; background: #fdfdfd; margin-bottom: 25px;">
        <label style="color: #0056b3;">📁 เลือกไฟล์จากตัวเครื่องของคุณ (รูปภาพหรือข้อความ)</label>
        <input type="file" id="fileInput" onchange="processFile()">
    </div>

    <button onclick="uploadToGitHub()">อัปโหลดไฟล์ขึ้น GitHub</button>

    <div id="status"></div>
</div>

<script>
let base64ContentInMemory = "";

function processFile() {
    const fileInput = document.getElementById('fileInput');
    const pathInput = document.getElementById('path');
    const file = fileInput.files[0];

    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            // อ่านไฟล์เป็น Data URL แล้วตัดเอาเฉพาะส่วนรหัส Base64 ล้วนๆ เพื่อให้รองรับไฟล์รูปภาพและไบนารีได้ร้อยเปอร์เซ็นต์
            const dataUrl = e.target.result;
            base64ContentInMemory = dataUrl.split(',')[1];
            
            // ตั้งค่า Path อัตโนมัติ (กรณียังไม่ได้ระบุ เพื่อป้องกันการลืมใส่ชื่อนามสกุลไฟล์)
            if (!pathInput.value.trim() || pathInput.value.trim() === "shanvpn") {
                pathInput.value = `shanvpn/${file.name}`;
            }
        };
        reader.readAsDataURL(file);
    }
}

async function uploadToGitHub() {
    const token = document.getElementById('token').value.trim();
    const repo = document.getElementById('repo').value.trim();
    let path = document.getElementById('path').value.trim();

    if (!token || !repo || !path || !base64ContentInMemory) {
        showStatus('กรุณากรอกข้อมูลให้ครบ และกดเลือกไฟล์ก่อนอัปโหลดครับ', 'error');
        return;
    }

    showStatus('กำลังอัปโหลด...', 'info');

    const url = `https://api.github.com/repos/${repo}/contents/${path}`;
    let sha = null;

    // เช็กสิทธิ์และการมีอยู่ของไฟล์เพื่อเขียนทับแบบปลอดภัย
    try {
        const checkResponse = await fetch(url, {
            method: 'GET',
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });
        if (checkResponse.ok) {
            const fileData = await checkResponse.json();
            sha = fileData.sha;
        }
    } catch (err) {
        // หากไม่มีไฟล์เดิมอยู่ก่อนหน้า
    }

    const bodyData = {
        message: `Uploaded via Web Tool at ${new Date().toLocaleString('th-TH')}`,
        content: base64ContentInMemory
    };

    if (sha) {
        bodyData.sha = sha;
    }

    try {
        const response = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify(bodyData)
        });

        if (response.ok) {
            showStatus('🎉 อัปโหลดและจัดการไฟล์บน GitHub สำเร็จเรียบร้อย!', 'success');
        } else {
            const errorData = await response.json();
            showStatus(`เกิดข้อผิดพลาดจาก GitHub: ${errorData.message}`, 'error');
        }
    } catch (error) {
        showStatus(`เชื่อมต่อล้มเหลว: ${error.message}`, 'error');
    }
}

function showStatus(text, type) {
    const statusDiv = document.getElementById('status');
    statusDiv.innerText = text;
    statusDiv.style.display = 'block';
    statusDiv.className = type;
}
</script>

</body>
</html>
