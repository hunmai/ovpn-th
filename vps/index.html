<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good VPS</title>
    <!-- นำเข้าฟอนต์การ์ตูนน่ารักๆ และไอคอน -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Mitr', sans-serif;
        }

        body {
            /* พื้นหลังสีพาสเทลสดใสแนวการ์ตูน */
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ตกแต่งก้อนเมฆจำลองบนพื้นหลัง */
        body::before, body::after {
            content: "☁️";
            position: absolute;
            font-size: 5rem;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }
        body::before { top: 10%; left: 10%; }
        body::after { bottom: 15%; right: 10%; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 30px;
            /* เส้นขอบหนาๆ สไตล์การ์ตูนคอมมิค */
            border: 4px solid #1e293b;
            /* เงาคมๆ แบบป๊อปอาร์ต (Neo-brutalism) */
            box-shadow: 8px 8px 0px #1e293b;
            position: relative;
            z-index: 1;
        }

        /* หัวข้อ Good VPS อ้วนกลมสดใส */
        h1 {
            font-size: 3.5rem;
            margin-bottom: 5px;
            color: #0284c7;
            text-shadow: 3px 3px 0px #bae6fd;
            -webkit-text-stroke: 2px #1e293b;
            display: inline-block;
        }

        .subtitle {
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 35px;
            font-weight: 500;
        }

        /* การจัดวางปุ่ม */
        .links-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 480px) {
            .links-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* สไตล์ปุ่มกดแนวกล่องของขวัญ/การ์ดเกม */
        .button-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 20px;
            border: 3px solid #1e293b;
            transition: all 0.2s ease;
            position: relative;
        }

        /* กำหนดสีแยกตามปุ่มให้สดใสสไตล์ Doodle */
        .link-1 { background-color: #ffedd5; color: #ea580c; box-shadow: 0 6px 0 #1e293b; } /* ส้ม */
        .link-2 { background-color: #f0fdf4; color: #16a34a; box-shadow: 0 6px 0 #1e293b; } /* เขียว */
        .link-3 { background-color: #ecfeff; color: #0891b2; box-shadow: 0 6px 0 #1e293b; } /* ฟ้า */
        .link-4 { background-color: #fdf2ff; color: #9333ea; box-shadow: 0 6px 0 #1e293b; } /* ม่วง */

        /* ไอคอนในปุ่ม */
        .button-link i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            transition: transform 0.3s ease;
        }

        /* เอฟเฟกต์ตอนเอาเมาส์ไปวาง (Hover) */
        .button-link:hover {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e293b;
        }

        .button-link:hover i {
            transform: scale(1.2) rotate(5deg);
        }

        /* เพิ่ม Mascot ตัวการ์ตูนตกแต่งด้านล่าง */
        .mascot {
            font-size: 3rem;
            margin-top: 25px;
            animation: bounce 2s infinite;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- หัวข้อเว็บ -->
        <h1>Good VPS ✨</h1>
        <p class="subtitle">รวมโฮสติ้งสุดเจ๋ง แนะนำสำหรับคุณ</p>

        <!-- กลุ่มปุ่มลิงก์สไตล์การ์ตูน -->
        <div class="links-grid">
            <a href="https://www.readyidc.com/" target="_blank" class="button-link link-1">
                <i class="fa-solid fa-box-open"></i> <!-- ไอคอนกล่องของขวัญ -->
                ReadyIDC
            </a>
            <a href="https://client.visperhost.net" target="_blank" class="button-link link-2">
                <i class="fa-solid fa-ghost"></i> <!-- ไอคอนผีน่ารัก -->
                VisperHost
            </a>
            <a href="https://bangmod.cloud/" target="_blank" class="button-link link-3">
                <i class="fa-solid fa-rocket"></i> <!-- ไอคอนจรวด -->
                Bangmod
            </a>
            <a href="https://client.hostinglotus.com/" target="_blank" class="button-link link-4">
                <i class="fa-solid fa-seedling"></i> <!-- ไอคอนต้นไม้อ่อน/ดอกบัว -->
                Hostinglotus
            </a>
        </div>

        <!-- มาสคอตหุ่นยนต์ต้อนรับด้านล่าง -->
        <div class="mascot">🤖👋</div>
    </div>

</body>
</html>
